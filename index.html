&lt;/style&gt;
&lt;script&gt;
(() =&gt; {
  &quot;use strict&quot;;
  const root = document.getElementById(&quot;fu-money-pnl-simulator&quot;);
  const field = (name) =&gt; root.querySelector(&quot;#pnl-&quot; + name);
  const inputs = {
    organicRegistrations: field(&quot;organic-registrations&quot;),
    organicShowUpRate: field(&quot;organic-show-up&quot;),
    organicCloseRate: field(&quot;organic-close&quot;),
    adsRegistrations: field(&quot;ads-registrations&quot;),
    adsCpl: field(&quot;ads-cpl&quot;),
    adsShowUpRate: field(&quot;ads-show-up&quot;),
    adsCloseRate: field(&quot;ads-close&quot;),
    orderValue: field(&quot;order-value&quot;)
  };
  const planInputs = {
    registrationsPer10kViews: field(&quot;registrations-per-10k-views&quot;),
    viewsPerOrganicPost: field(&quot;views-per-organic-post&quot;)
  };
  const savedInputs = { ...inputs, ...planInputs };
  const validation = root.querySelector(&quot;[data-validation]&quot;);
  const netLabel = root.querySelector(&quot;[data-net-label]&quot;);
  const ownLabel = root.querySelector(&quot;[data-own-label]&quot;);
  const mtcLabel = root.querySelector(&quot;[data-mtc-label]&quot;);
  const lossNote = root.querySelector(&quot;[data-loss-note]&quot;);
  const announcement = root.querySelector(&quot;[data-announcement]&quot;);
  const salesShares = root.querySelectorAll(&quot;[data-sales-share]&quot;);
  const channelResultCells = root.querySelectorAll(&quot;[data-channel-result]&quot;);
  const outputs = new Map();
  for (const cell of root.querySelectorAll(&quot;[data-out]&quot;)) {
    const key = cell.dataset.out;
    if (!outputs.has(key)) outputs.set(key, []);
    outputs.get(key).push(cell);
  }

  // October amounts are stored in cents. WABA and gateway charges use the October ratios.
  const october = Object.freeze({
    organicRegistrations: 327,
    adsRegistrations: 356,
    attendees: 371,
    orders: 50,
    revenue: 10629072,
    adNet: 1821978,
    adGross: 1967736,
    wabaNet: 18200,
    stripe: 151033,
    payex: 138989,
    zoom: 33856,
    skool: 3771,
    hotlink: 3000
  });
  const octoberRegistrations = october.organicRegistrations + october.adsRegistrations;
  const fixed = october.zoom + october.skool + october.hotlink;
  const commissionRate = .075;
  const salesSstRate = 8 / 108;
  const stripeRate = october.stripe / october.revenue;
  const payexRate = october.payex / october.revenue;
  const revenueAfterFeesRate = 1 - salesSstRate - stripeRate - payexRate;
  const round = (value) =&gt; Math.sign(value) * Math.round(Math.abs(value) + 1e-9);
  const currency = new Intl.NumberFormat(&quot;en-MY&quot;, { style: &quot;currency&quot;, currency: &quot;MYR&quot; });
  const count = new Intl.NumberFormat(&quot;en-MY&quot;, { maximumFractionDigits: 1 });
  const multiple = new Intl.NumberFormat(&quot;en-MY&quot;, { maximumFractionDigits: 2 });
  const percent = new Intl.NumberFormat(&quot;en-MY&quot;, {
    style: &quot;percent&quot;, minimumFractionDigits: 2, maximumFractionDigits: 2
  });
  const money = (cents) =&gt; currency.format(cents / 100);
  const baseShowUp = (100 * october.attendees / octoberRegistrations).toFixed(6);
  const baseClose = (100 * october.orders / october.attendees).toFixed(6);
  const defaults = {
    organicRegistrations: october.organicRegistrations,
    organicShowUpRate: baseShowUp,
    organicCloseRate: baseClose,
    adsRegistrations: october.adsRegistrations,
    adsCpl: (october.adNet / 100 / october.adsRegistrations).toFixed(6),
    adsShowUpRate: baseShowUp,
    adsCloseRate: baseClose,
    orderValue: (october.revenue / october.orders / 100).toFixed(4),
    registrationsPer10kViews: 10,
    viewsPerOrganicPost: 4100
  };
  const moneyKeys = [
    &quot;organicRevenue&quot;, &quot;adsRevenue&quot;, &quot;revenue&quot;, &quot;adNet&quot;, &quot;adGross&quot;, &quot;adSst&quot;, &quot;adWht&quot;,
    &quot;waba&quot;, &quot;salesSst&quot;, &quot;stripe&quot;, &quot;payex&quot;, &quot;commission&quot;, &quot;variable&quot;, &quot;beforeCommission&quot;,
    &quot;profit&quot;, &quot;ownShare&quot;, &quot;mtcShare&quot;,
    &quot;adsVariable&quot;, &quot;adsFixed&quot;, &quot;adsProfit&quot;, &quot;organicVariable&quot;, &quot;organicFixed&quot;, &quot;organicProfit&quot;
  ];
  const peopleKeys = [&quot;organicAttendees&quot;, &quot;organicOrders&quot;, &quot;adsAttendees&quot;, &quot;adsOrders&quot;, &quot;attendees&quot;, &quot;orders&quot;];
  let current = null;
  let liveTimer;

  function put(key, value) {
    for (const cell of outputs.get(key)) {
      if (cell.textContent !== value) cell.textContent = value;
    }
  }

  function renderOrganicPlan() {
    const registrations = inputs.organicRegistrations.validity.valid
      ? inputs.organicRegistrations.valueAsNumber : NaN;
    const registrationsPer10k = planInputs.registrationsPer10kViews.valueAsNumber;
    const viewsPerPost = planInputs.viewsPerOrganicPost.valueAsNumber;
    const views = registrations === 0 ? 0
      : registrationsPer10k &gt; 0 ? Math.ceil(registrations * 10000 / registrationsPer10k) : NaN;
    const posts = views === 0 ? 0 : viewsPerPost &gt; 0 ? Math.ceil(views / viewsPerPost) : NaN;
    put(&quot;organicMonthlyViews&quot;, Number.isSafeInteger(views) ? count.format(views) : &quot;—&quot;);
    put(&quot;organicPosts&quot;, Number.isSafeInteger(posts) ? count.format(posts) + &quot; 篇&quot; : &quot;—&quot;);
  }

  function funnel(registrations, showUpRate, closeRate) {
    const attendees = registrations.valueAsNumber * showUpRate.valueAsNumber / 100;
    return { attendees, orders: attendees * closeRate.valueAsNumber / 100 };
  }

  function getSales() {
    const organic = funnel(inputs.organicRegistrations, inputs.organicShowUpRate, inputs.organicCloseRate);
    const ads = funnel(inputs.adsRegistrations, inputs.adsShowUpRate, inputs.adsCloseRate);
    const attendees = organic.attendees + ads.attendees;
    const orders = organic.orders + ads.orders;
    const orderValue = inputs.orderValue.valueAsNumber * 100;
    const revenue = round(orders * orderValue);
    const organicRevenue = round(organic.orders * orderValue);
    return {
      organicAttendees: organic.attendees, organicOrders: organic.orders, organicRevenue,
      adsAttendees: ads.attendees, adsOrders: ads.orders, adsRevenue: revenue - organicRevenue,
      attendees, orders, revenue
    };
  }

  function splitChannelCosts(sales, adsDirectCosts, revenueCosts, commission) {
    const organicRegistrations = inputs.organicRegistrations.valueAsNumber;
    const registrations = organicRegistrations + inputs.adsRegistrations.valueAsNumber;
    const organicShare = sales.revenue ? sales.organicRevenue / sales.revenue
      : registrations ? organicRegistrations / registrations : .5;
    const organicRevenueCosts = round(revenueCosts * organicShare);
    const organicFixed = round(fixed * organicShare);
    const adsFixed = fixed - organicFixed;
    const organicCommission = round((sales.organicRevenue - organicRevenueCosts - organicFixed) * commissionRate);
    const organicVariable = organicRevenueCosts + organicCommission;
    // Allocate the rounding remainder to ads so both channels reconcile to the project.
    const adsVariable = adsDirectCosts + revenueCosts - organicRevenueCosts + commission - organicCommission;
    return {
      adsVariable, adsFixed, adsProfit: sales.adsRevenue - adsVariable - adsFixed,
      organicVariable, organicFixed, organicProfit: sales.organicRevenue - organicVariable - organicFixed
    };
  }

  function getScenario() {
    if (Object.values(inputs).some((input) =&gt; !input.validity.valid)) return null;

    const sales = getSales();
    const { revenue, adsRevenue } = sales;
    const adNet = round(inputs.adsRegistrations.valueAsNumber * inputs.adsCpl.valueAsNumber * 100);
    if (!Number.isSafeInteger(revenue) || !Number.isSafeInteger(adNet) ||
        revenue &gt; Number.MAX_SAFE_INTEGER / 4 || adNet &gt; Number.MAX_SAFE_INTEGER / 4) return null;

    const adSst = round(adNet * .08);
    const adGross = adNet + adSst;
    const adWht = round(adNet * .08);
    const wabaNet = round(adNet * (october.wabaNet / october.adNet));
    const waba = wabaNet + 2 * round(wabaNet * .08);
    const salesSst = round(revenue * salesSstRate);
    const stripe = round(revenue * stripeRate);
    const payex = round(revenue * payexRate);
    const adsDirectCosts = adGross + adWht + waba;
    const revenueCosts = salesSst + stripe + payex;
    const variableBeforeCommission = adsDirectCosts + revenueCosts;
    const beforeCommission = revenue - variableBeforeCommission - fixed;
    const commission = round(beforeCommission * commissionRate);
    const variable = variableBeforeCommission + commission;
    const profit = beforeCommission - commission;
    const ownShare = round(profit * .5);
    return {
      ...sales, ...splitChannelCosts(sales, adsDirectCosts, revenueCosts, commission),
      adNet, adGross, adSst, adWht, waba, salesSst, stripe, payex,
      commission, variable, beforeCommission, profit, ownShare, mtcShare: profit - ownShare,
      zoom: october.zoom, skool: october.skool, hotlink: october.hotlink, fixed,
      roas: adNet ? revenue / adNet : null,
      adsRoas: adNet ? adsRevenue / adNet : null,
      // Commission is zero at break-even, and shared fixed costs stay at the project level.
      adsBreakEvenRoas: adNet ? adsDirectCosts / (revenueAfterFeesRate * adNet) : null
    };
  }

  function renderChannels(scenario) {
    const margins = {};
    for (const cell of channelResultCells) {
      const channel = cell.dataset.channelResult;
      const profit = scenario?.[channel + &quot;Profit&quot;];
      const revenue = scenario?.[channel + &quot;Revenue&quot;];
      const outcome = profit &gt; 0 ? &quot;gain&quot; : profit &lt; 0 ? &quot;loss&quot; : &quot;flat&quot;;
      cell.dataset.outcome = outcome;
      margins[channel] = revenue &gt; 0 ? percent.format(profit / revenue) : null;
      put(channel + &quot;Status&quot;, scenario ? { gain: &quot;盈利&quot;, loss: &quot;亏损&quot;, flat: &quot;打平&quot; }[outcome] : &quot;&quot;);
      put(channel + &quot;Margin&quot;, margins[channel] ?? &quot;—&quot;);
    }
    let comparison = &quot;&quot;;
    if (scenario &amp;&amp; margins.ads &amp;&amp; margins.organic) {
      comparison = margins.ads === margins.organic ? &quot;两组的净利率相同。&quot;
        : scenario.adsProfit / scenario.adsRevenue &gt; scenario.organicProfit / scenario.organicRevenue
          ? &quot;广告组的净利率较高。&quot; : &quot;Organic 的净利率较高。&quot;;
    }
    put(&quot;channelEfficiency&quot;, comparison);
  }

  function render() {
    renderOrganicPlan();
    current = getScenario();
    renderChannels(current);
    validation.hidden = current !== null;
    const loss = current?.profit &lt; 0;
    root.classList.toggle(&quot;pnl-loss&quot;, loss);
    netLabel.textContent = loss ? &quot;项目净亏损&quot; : &quot;项目净利润&quot;;
    clearTimeout(liveTimer);
    for (const cell of salesShares) {
      cell.textContent = current?.revenue ? percent.format(current[cell.dataset.salesShare] / current.revenue) : &quot;—&quot;;
    }

    if (!current) {
      for (const key of [...moneyKeys, ...peopleKeys, &quot;roas&quot;, &quot;adsRoas&quot;, &quot;adsBreakEvenRoas&quot;]) put(key, &quot;—&quot;);
      ownLabel.textContent = &quot;你的 50% 分成&quot;;
      mtcLabel.textContent = &quot;MTC 的 50% 分成&quot;;
      lossNote.hidden = true;
      announcement.textContent = &quot;&quot;;
      return false;
    }

    for (const key of moneyKeys) put(key, money(current[key]));
    for (const key of peopleKeys) put(key, count.format(current[key]) + &quot; 人&quot;);
    for (const key of [&quot;roas&quot;, &quot;adsRoas&quot;]) {
      put(key, current[key] === null ? &quot;—&quot; : multiple.format(current[key]) + &quot;×&quot;);
    }
    const breakEven = current.adsBreakEvenRoas;
    put(&quot;adsBreakEvenRoas&quot;, breakEven === null ? &quot;—&quot;
      : multiple.format(Math.ceil(breakEven * 100 - 1e-9) / 100) + &quot;×&quot;);
    ownLabel.textContent = loss ? &quot;你承担的 50% 亏损&quot; : &quot;你的 50% 分成&quot;;
    mtcLabel.textContent = loss ? &quot;MTC 承担的 50% 亏损&quot; : &quot;MTC 的 50% 分成&quot;;
    lossNote.hidden = current.commission &gt;= 0;
    liveTimer = setTimeout(() =&gt; {
      announcement.textContent = &quot;净利润 &quot; + money(current.profit) + &quot;，&quot; + ownLabel.textContent + &quot; &quot; + money(current.ownShare);
    }, 240);
    return true;
  }

  function restore(state) {
    const model = state?.modelContent ?? state;
    if (![1, 2, 3, 4].includes(model?.version)) return;
    const fields = { ...model.fields };
    if (model.version &lt; 3) {
      const registrations = Number.isSafeInteger(fields.registrations) &amp;&amp; fields.registrations &gt;= 0
        ? fields.registrations : octoberRegistrations;
      let showUpRate = fields.showUpRate;
      let closeRate = fields.closeRate;
      if (model.version === 1 &amp;&amp; Number.isFinite(closeRate) &amp;&amp; closeRate &gt;= 0 &amp;&amp; closeRate &lt;= 100) {
        // Preserve the legacy registration-to-payment rate.
        showUpRate = Math.max(Number(baseShowUp), closeRate);
        closeRate = Number((100 * (closeRate / showUpRate)).toFixed(9));
      }
      fields.organicRegistrations = Math.round(registrations * (october.organicRegistrations / octoberRegistrations));
      fields.adsRegistrations = registrations - fields.organicRegistrations;
      fields.organicShowUpRate = fields.adsShowUpRate = showUpRate;
      fields.organicCloseRate = fields.adsCloseRate = closeRate;
    }
    for (const [key, input] of Object.entries(savedInputs)) {
      const value = fields[key];
      if (!Number.isFinite(value) || input.valueAsNumber === value) continue;
      input.value = value;
      if (!input.validity.valid) input.value = defaults[key];
    }
    const adsRegistrations = inputs.adsRegistrations.valueAsNumber;
    if (model.version &lt; 4 &amp;&amp; adsRegistrations &gt; 0) {
      // Convert the previous budget to a CPL while keeping the existing scenario&#x27;s spend.

    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
